<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictionary word-Lockup Tool using Binary search</title>

  <link rel="stylesheet" href="style.css">     
</head>
<body>
  <div class="container"> 
    <div class="dictionary-card">
       <h1>📖 Dictionary Word Lookup</h1> 
       <p class="subtitle"> Search the meaning of a word using Binary Search </p> 
       <div class="search-box">
         <input type="text" id="wordInput" placeholder="Enter a word..." autocomplete="off" > 
         <button id="searchButton"> Search </button> 
        </div> 
         <div id="result" class="result"> 
          <p>Enter a word to search.</p>
         </div> 
        </div> 
      </div>
       <script src="script.js"></script>
</body>
</html>
